services:
  postgres:
    image: postgres:16-alpine

    container_name: genie_vendor_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-genie_vendor_project}

    ports:
      - "${POSTGRES_HOST_PORT:-5431}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-genie_vendor_project}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
