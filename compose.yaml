services:
  postgres:
    image: postgres:16-alpine

    container_name: genie_vendor_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: genie_vendor_project

    ports:
      - "5431:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d genie_vendor_project"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: